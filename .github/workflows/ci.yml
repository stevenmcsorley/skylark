name: CI

# One definition of "the tests", used two ways: it runs on every pull request, and deploy.yml calls it before anything is built on the Pi,
# so a change that fails these never reaches production. It mirrors what the agent factory runs as the project's verify command.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build --outDir /tmp/skylark-dist --emptyOutDir

  mcp:
    name: MCP server (Code Mode tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: mcp/package-lock.json }   # the version the service image runs
      - run: npm ci --no-audit --no-fund
      - run: npm test

  backend:
    name: Backend (Django tests, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements.txt\nconstraints.txt" }
      - run: pip install -r requirements.txt -c constraints.txt
      - run: scripts/test-backend.sh
